# Community cross-test: OpenTDFKit (this repo) ↔ go peer via opentdf-tests.
#
# Pulls arkavo-org/opentdf-tests (default: main branch tip).
# Runs native macOS platform deps (Postgres + Keycloak + platform) and pytest
# for swift × go Base TDF only.
#
# Two legs run side by side (matrix `go-source`):
#   upstream    — go CLI from the released opentdf/platform `otdfctl/*` tag.
#   arkavo-fork — go CLI (otdfctl + sdk) built from arkavo-org/opentdf-platform
#                 at `fork-ref` via the fork's go.work.
# The platform SERVICE is upstream in both legs: the fork's service auth is
# CWT-only and cannot start against the harness's Keycloak IdP. Only the go
# client comes from the fork.
#
# Cross-repo: opentdf-tests community-xtest.yml exercises OpenTDFKit the other
# direction.
name: X-Test

on:
  pull_request:
    paths:
      - "OpenTDFKit/**"
      - "OpenTDFKitCLI/**"
      - "OpenTDFKitTests/**"
      - "Package.swift"
      - "Package.resolved"
      - "xtest/**"
      - ".github/workflows/xtest.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests-ref:
        required: false
        type: string
        default: latest
        description: >-
          arkavo-org/opentdf-tests ref: 'latest' (tracks main
          branch tip), branch, tag, or SHA.
      platform-ref:
        required: false
        type: string
        default: latest
        description: "opentdf/platform ref: 'latest'/'lts', branch, tag, or SHA"
      otdfctl-ref:
        required: false
        type: string
        default: latest
        description: "go/otdfctl peer ref: 'latest'/'lts', branch, tag, or SHA"
      fork-ref:
        required: false
        type: string
        default: main
        description: >-
          arkavo-org/opentdf-platform ref for the arkavo-fork go leg
          (otdfctl + sdk built from source): branch, tag, or SHA.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-refs:
    name: Resolve floating pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tests-ref: ${{ steps.resolve.outputs.tests-ref }}
      platform-ref: ${{ steps.resolve.outputs.platform-ref }}
      platform-tag: ${{ steps.resolve.outputs.platform-tag }}
      go-ref: ${{ steps.resolve.outputs.go-ref }}
      go-channel: ${{ steps.resolve.outputs.go-channel }}
      fork-ref: ${{ steps.resolve.outputs.fork-ref }}
      fork-channel: ${{ steps.resolve.outputs.fork-channel }}
    env:
      TESTS_REF_IN: ${{ inputs.tests-ref || 'latest' }}
      PLATFORM_REF_IN: ${{ inputs.platform-ref || 'latest' }}
      OTDFCTL_REF_IN: ${{ inputs.otdfctl-ref || 'latest' }}
      FORK_REF_IN: ${{ inputs.fork-ref || 'main' }}
      GH_TOKEN: ${{ github.token }}
      # Harness main; SDK PRs pick up infra fixes without a re-tag.
      TESTS_FALLBACK_REF: main
    steps:
      - name: Resolve pins
        id: resolve
        run: |
          set -euo pipefail

          resolve_tests() {
            local input="$1"
            if [[ "$input" != "latest" ]]; then
              echo "$input"
              return 0
            fi
            # Prefer the branch tip over a stale release so SDK PRs pick up
            # infra fixes without a re-tag.
            echo "Using live branch ${TESTS_FALLBACK_REF} for floating latest" >&2
            echo "${TESTS_FALLBACK_REF}"
          }

          # platform/go latest via git tags (service/* and otdfctl/*).
          resolve_platform_latest() {
            git ls-remote --tags --refs https://github.com/opentdf/platform.git \
              | awk '{print $2}' | sed 's#refs/tags/##' \
              | grep -E '^service/v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1V -k2,2V -k3,3V \
              | tail -1
          }
          resolve_otdfctl_latest() {
            git ls-remote --tags --refs https://github.com/opentdf/platform.git \
              | awk '{print $2}' | sed 's#refs/tags/##' \
              | grep -E '^otdfctl/v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1V -k2,2V -k3,3V \
              | tail -1
          }

          TESTS_REF=$(resolve_tests "$TESTS_REF_IN")

          if [[ "$PLATFORM_REF_IN" == "latest" || "$PLATFORM_REF_IN" == "lts" ]]; then
            PLATFORM_REF=$(resolve_platform_latest)
            PLATFORM_TAG=latest
            [[ -n "$PLATFORM_REF" ]] || { echo "failed to resolve platform latest" >&2; exit 1; }
          else
            PLATFORM_REF="$PLATFORM_REF_IN"
            PLATFORM_TAG="$PLATFORM_REF_IN"
          fi

          if [[ "$OTDFCTL_REF_IN" == "latest" || "$OTDFCTL_REF_IN" == "lts" ]]; then
            GO_REF=$(resolve_otdfctl_latest)
            GO_CHANNEL="${GO_REF#otdfctl/}"
            [[ -n "$GO_REF" ]] || { echo "failed to resolve otdfctl latest" >&2; exit 1; }
          else
            GO_REF="$OTDFCTL_REF_IN"
            GO_CHANNEL="$OTDFCTL_REF_IN"
          fi

          # arkavo-fork leg: the go CLI is built from source, so the channel is
          # only a dist directory name (sdk/go/dist/<channel>). Prefix it so it
          # never matches the harness's released-version regex and stays a head.
          FORK_REF="$FORK_REF_IN"
          [[ -n "$FORK_REF" ]] || { echo "fork-ref must not be empty" >&2; exit 1; }
          FORK_CHANNEL="arkavo-$(printf '%s' "$FORK_REF" | sed 's/[^A-Za-z0-9._-]/-/g')"

          {
            echo "tests-ref=${TESTS_REF}"
            echo "platform-ref=${PLATFORM_REF}"
            echo "platform-tag=${PLATFORM_TAG}"
            echo "go-ref=${GO_REF}"
            echo "go-channel=${GO_CHANNEL}"
            echo "fork-ref=${FORK_REF}"
            echo "fork-channel=${FORK_CHANNEL}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved pins"
            echo ""
            echo "| Component | Input | Resolved |"
            echo "|---|---|---|"
            echo "| opentdf-tests | \`${TESTS_REF_IN}\` | \`${TESTS_REF}\` |"
            echo "| platform | \`${PLATFORM_REF_IN}\` | \`${PLATFORM_REF}\` |"
            echo "| go/otdfctl | \`${OTDFCTL_REF_IN}\` | \`${GO_REF}\` (channel \`${GO_CHANNEL}\`) |"
            echo "| arkavo-org/opentdf-platform (go client) | \`${FORK_REF_IN}\` | \`${FORK_REF}\` (channel \`${FORK_CHANNEL}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "tests=${TESTS_REF} platform=${PLATFORM_REF} go=${GO_REF} fork=${FORK_REF}"

  community-swift:
    name: "swift ↔ go (${{ matrix.go-source }})"
    needs: [resolve-refs]
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # upstream: released opentdf/platform otdfctl tag (stays red until
        #   opentdf/platform#4063 ships in a tag — released go only reads
        #   0.manifest.json, this repo writes the spec name manifest.json).
        # arkavo-fork: otdfctl + sdk from arkavo-org/opentdf-platform@fork-ref.
        go-source: [upstream, arkavo-fork]
    permissions:
      contents: read
      packages: read
    env:
      TESTS_REF: ${{ needs.resolve-refs.outputs.tests-ref }}
      PLATFORM_REF: ${{ needs.resolve-refs.outputs.platform-ref }}
      PLATFORM_TAG: ${{ needs.resolve-refs.outputs.platform-tag }}
      OTDFCTL_REF: ${{ needs.resolve-refs.outputs.go-ref }}
      FORK_REF: ${{ needs.resolve-refs.outputs.fork-ref }}
      # dist directory the go peer lands in (sdk/go/dist/<GO_CHANNEL>).
      GO_CHANNEL: ${{ matrix.go-source == 'upstream' && needs.resolve-refs.outputs.go-channel || needs.resolve-refs.outputs.fork-channel }}
    steps:
      - name: Checkout OpenTDFKit
        uses: actions/checkout@v4
        with:
          path: OpenTDFKit
          persist-credentials: false

      - name: Checkout opentdf-tests
        uses: actions/checkout@v4
        with:
          repository: arkavo-org/opentdf-tests
          ref: ${{ env.TESTS_REF }}
          path: otdftests
          persist-credentials: false

      - name: Checkout arkavo-org/opentdf-platform (go client source)
        if: matrix.go-source == 'arkavo-fork'
        uses: actions/checkout@v4
        with:
          repository: arkavo-org/opentdf-platform
          ref: ${{ env.FORK_REF }}
          path: platform-fork
          persist-credentials: false

      - name: Wire this OpenTDFKit into xtest sdk/swift
        run: |
          set -euo pipefail
          mkdir -p otdftests/xtest/sdk/swift/src
          # Use the PR/commit under test, not a released OpenTDFKit pin.
          rm -rf otdftests/xtest/sdk/swift/src/main
          ln -s "$(pwd)/OpenTDFKit" otdftests/xtest/sdk/swift/src/main
          ls -la otdftests/xtest/sdk/swift/src/main/Package.swift

      - name: Load extra keys
        id: load-extra-keys
        run: echo "EXTRA_KEYS=$(jq -c <otdftests/xtest/extra-keys.json)" >> "${GITHUB_OUTPUT}"

      - name: Start platform (native macOS)
        id: run-platform
        uses: ./otdftests/.github/actions/start-up-with-containers-macos
        with:
          platform-ref: ${{ env.PLATFORM_REF }}
          ec-tdf-enabled: true
          extra-keys: ${{ steps.load-extra-keys.outputs.EXTRA_KEYS }}
          log-type: json
          pqc-enabled: true

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Capture platform otdfctl location
        if: matrix.go-source == 'upstream'
        id: platform-otdfctl
        run: |-
          if [ -d "$PLATFORM_DIR/otdfctl" ] && [ -f "$PLATFORM_DIR/otdfctl/go.mod" ]; then
            echo "dir=$(pwd)/$PLATFORM_DIR/otdfctl" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C "$PLATFORM_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
        env:
          PLATFORM_DIR: ${{ steps.run-platform.outputs.platform-working-dir }}

      - name: Resolve go peer
        if: matrix.go-source == 'upstream'
        id: resolve-go
        working-directory: otdftests
        run: |-
          INFO=$(uv run --project otdf-sdk-mgr otdf-sdk-mgr versions resolve go "${OTDFCTL_REF}")
          echo "version-info=$INFO" >> "$GITHUB_OUTPUT"
          echo "$INFO" | jq .

      - name: Configure otdfctl (go)
        if: matrix.go-source == 'upstream'
        id: configure-go
        uses: ./otdftests/xtest/setup-cli-tool
        with:
          path: otdftests/xtest/sdk
          sdk: go
          version-info: ${{ steps.resolve-go.outputs.version-info }}
          platform-otdfctl-dir: ${{ steps.platform-otdfctl.outputs.dir }}
          platform-otdfctl-sha: ${{ steps.platform-otdfctl.outputs.sha }}

      - name: Build go CLI from source when dist is missing
        if: matrix.go-source == 'upstream'
        working-directory: otdftests/xtest/sdk/go
        run: |-
          set -euo pipefail
          # Artifact installs land in dist/${GO_CHANNEL}. Head builds and
          # BUILD_FROM_SOURCE fallbacks (tagged otdfctl that failed `go install`)
          # land in src/ and need `make`. Gating on heads[0] skipped that make
          # for tagged peers, so pytest's `find sdk/go/dist` then crashed.
          if [[ -x "dist/${GO_CHANNEL}/cli.sh" ]]; then
            echo "go CLI already at dist/${GO_CHANNEL}/cli.sh"
            exit 0
          fi
          if [[ -e "src/${GO_CHANNEL}" ]]; then
            echo "Building go CLI VERSIONS=${GO_CHANNEL}"
            make "VERSIONS=${GO_CHANNEL}"
          elif [[ -e src/main ]]; then
            echo "Building go CLI VERSIONS=main"
            make VERSIONS=main
          else
            echo "::error::go CLI missing: no dist/${GO_CHANNEL}/cli.sh and no src/${GO_CHANNEL} or src/main"
            ls -la . src dist 2>/dev/null || true
            exit 1
          fi
          if [[ ! -x "dist/${GO_CHANNEL}/cli.sh" && ! -x dist/main/cli.sh ]]; then
            echo "::error::make finished but dist/${GO_CHANNEL}/cli.sh (and dist/main/cli.sh) still missing"
            ls -la dist 2>/dev/null || true
            exit 1
          fi

      - name: Build go CLI from arkavo-org/opentdf-platform fork
        if: matrix.go-source == 'arkavo-fork'
        working-directory: otdftests/xtest/sdk/go
        run: |-
          set -euo pipefail
          # The harness Makefile builds every entry under src/, follows the
          # symlink to its real path and uses the enclosing go.work when there
          # is one ("Using platform go.work"), so the fork's in-tree sdk/ is
          # what otdfctl links against — no go.mod replace needed.
          FORK_DIR="${GITHUB_WORKSPACE}/platform-fork"
          for f in go.work otdfctl/go.mod sdk/go.mod; do
            if [[ ! -f "${FORK_DIR}/${f}" ]]; then
              echo "::error::platform-fork/${f} missing; fork layout changed?"
              ls -la "${FORK_DIR}" 2>/dev/null || true
              exit 1
            fi
          done
          echo "fork sha: $(git -C "${FORK_DIR}" rev-parse HEAD) (ref ${FORK_REF})"
          mkdir -p src
          ln -sfn "${FORK_DIR}/otdfctl" "src/${GO_CHANNEL}"
          make "VERSIONS=${GO_CHANNEL}"
          if [[ ! -x "dist/${GO_CHANNEL}/cli.sh" ]]; then
            echo "::error::make finished but dist/${GO_CHANNEL}/cli.sh is missing"
            ls -la dist 2>/dev/null || true
            exit 1
          fi
          "dist/${GO_CHANNEL}/otdfctl" --version --json || true

      - name: Build swift CLI from this checkout
        run: make VERSIONS=main
        working-directory: otdftests/xtest/sdk/swift

      - name: Probe swift supports
        working-directory: otdftests/xtest
        run: |-
          set -e
          ./sdk/swift/dist/main/cli.sh supports tdf || ./sdk/swift/dist/main/cli.sh supports ztdf
          ./sdk/swift/dist/main/cli.sh supports hexless
          ! ./sdk/swift/dist/main/cli.sh supports ecwrap || exit 1

      - name: Platform version
        working-directory: ${{ steps.run-platform.outputs.platform-working-dir }}
        run: |-
          if PLATFORM_VERSION=$(go run ./service version 2>&1); then
            echo "PLATFORM_VERSION=$PLATFORM_VERSION" >> "$GITHUB_ENV"
          else
            echo "PLATFORM_VERSION=${PLATFORM_TAG}" >> "$GITHUB_ENV"
          fi

      - run: uv sync
        working-directory: otdftests/xtest

      - name: Run community xtest (swift × go, Base TDF)
        working-directory: otdftests/xtest
        env:
          PLATFORM_DIR: "../../${{ steps.run-platform.outputs.platform-working-dir }}"
          PLATFORM_LOG_FILE: "../../${{ steps.run-platform.outputs.platform-log-file }}"
          PLATFORM_TAG: ${{ env.PLATFORM_TAG }}
          SCHEMA_FILE: "manifest.schema.json"
        run: |-
          set -euo pipefail
          mkdir -p test-results
          GO_CH="${GO_CHANNEL}"
          # go dist may be under tag (release install) or main (head). Prefer
          # the channel from resolve-refs; fall back to whatever exists.
          # Do not `find` a missing dist dir: with `set -euo pipefail` that is
          # a hard failure ("find: sdk/go/dist: No such file or directory").
          if [[ ! -x "sdk/go/dist/${GO_CH}/cli.sh" ]]; then
            if [[ -x sdk/go/dist/main/cli.sh ]]; then
              GO_CH=main
            elif [[ -d sdk/go/dist ]]; then
              GO_CH=$(find sdk/go/dist -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1 || true)
            else
              echo "::error::sdk/go/dist does not exist; go CLI was not built"
              ls -la sdk/go sdk/go/src 2>/dev/null || true
              exit 1
            fi
          fi
          if [[ -z "${GO_CH}" || ! -x "sdk/go/dist/${GO_CH}/cli.sh" ]]; then
            echo "::error::no executable sdk/go/dist/${GO_CH:-<empty>}/cli.sh"
            ls -la sdk/go/dist 2>/dev/null || true
            exit 1
          fi
          echo "Using go channel: ${GO_CH}"
          uv run pytest -n auto --dist loadscope \
            --html=test-results/opentdfkit-xtest.html \
            --self-contained-html \
            --junitxml=test-results/opentdfkit-xtest.junit.xml \
            --sdks-encrypt "swift@main go@${GO_CH}" \
            --sdks-decrypt "swift@main go@${GO_CH}" \
            --containers tdf \
            --focus swift \
            -m stage1 \
            -ra -v \
            test_tdfs.py \
            | tee test-results/opentdfkit-xtest.log

      - name: Upload results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ job.status == 'success' && '✅' || '❌' }} opentdfkit-xtest-${{ matrix.go-source }}
          path: otdftests/xtest/test-results/**

      - name: Upload platform logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opentdfkit-xtest-platform-logs-${{ matrix.go-source }}
          path: ${{ steps.run-platform.outputs.platform-log-file }}
          if-no-files-found: ignore
