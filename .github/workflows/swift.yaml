name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA_PATH: ".build"

jobs:
  lint:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      - name: Install SwiftFormat
        # Pinned rather than the runner's preinstalled copy, whose version
        # drifts; keep in step with `--minversion` in .swiftformat.
        env:
          SWIFTFORMAT_VERSION: "0.64.1"
          SWIFTFORMAT_SHA256: "0e5762a848d738602c7a983b26812031e634d85e357db070968b9c805f253eff"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Cache SwiftFormat
        uses: actions/cache@v4
        with:
          path: .swiftformat.cache
          key: ${{ runner.os }}-swiftformat-${{ hashFiles('.swiftformat') }}
          restore-keys: |
            ${{ runner.os }}-swiftformat-

      - name: Run SwiftFormat
        # Rules and Swift version are pinned in the repo's .swiftformat config.
        run: |
          swiftformat --version
          swiftformat --cache .swiftformat.cache --lint .

  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      - name: Cache Swift packages
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build Debug
        run: swift build -v

      - name: Build Release
        run: swift build -c release -v

      - name: Build CLI
        run: swift build -c release --product OpenTDFKitCLI

  test:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      - name: Cache Swift packages
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate LCOV coverage report
        run: |
          xcrun llvm-cov export \
            -format=lcov \
            -ignore-filename-regex='.build|Tests' \
            -instr-profile=.build/debug/codecov/default.profdata \
            .build/debug/OpenTDFKitPackageTests.xctest/Contents/MacOS/OpenTDFKitPackageTests \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          fail_ci_if_error: false
          verbose: true

      - name: Run memory benchmarks, one process each
        # Measured alone: in a shared process, memory earlier tests freed
        # absorbs the allocations being measured. Runs after the coverage
        # upload because each run rewrites the coverage data.
        env:
          OPENTDFKIT_MEMORY_BENCHMARK: "1"
        run: |
          for test in testMemoryUsageWith2MBChunk testMemoryUsageWith25MBChunk testMultiSegmentFileEncryptionBoundsMemory; do
            swift test --enable-code-coverage --filter "StreamingBenchmarkTests/$test"
          done

  # TDF `ec-wrapped` interop with the go reference (opentdf-platform lib/ocrypto),
  # no platform needed: go tests its own verifier, then opens a key access
  # object and a TDFKAS.rewrap response that Swift wrote. The go → Swift
  # direction (the committed go fixture) runs in the `test` job.
  interop-ec-wrapped:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/interop/ec-wrapped/go.mod
          cache-dependency-path: scripts/interop/ec-wrapped/go.sum

      - name: Test the go verifier
        working-directory: scripts/interop/ec-wrapped
        run: |
          go vet ./...
          go test ./...

      - name: Write a Swift fixture from an encryptFile archive
        env:
          OPENTDFKIT_INTEROP_OUT: ${{ runner.temp }}/swift-interop.json
        run: |
          swift test --filter TDFKASEncryptorTests/testWriteSwiftFixtureForGo
          # The test skips without the variable; fail if it wrote nothing.
          test -s "$OPENTDFKIT_INTEROP_OUT"

      - name: Open the Swift fixture with go
        working-directory: scripts/interop/ec-wrapped
        env:
          OPENTDFKIT_INTEROP_OUT: ${{ runner.temp }}/swift-interop.json
        run: go run . verify "$OPENTDFKIT_INTEROP_OUT"

  benchmark:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift version
        run: swift --version

      - name: Cache Swift packages
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run KeyStore Benchmarks
        run: |
          set -o pipefail
          swift test --configuration release --filter KeyStoreBenchmarkTests | tee keystore-benchmark.log

      - name: Run KASService Benchmarks
        run: |
          set -o pipefail
          swift test --configuration release --filter KASServiceBenchmarkTests | tee kasservice-benchmark.log

      - name: Run NanoTDF Benchmarks
        run: |
          set -o pipefail
          swift test --configuration release --filter NanoTDFBenchmarkTests | tee nanotdf-benchmark.log

      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmark-baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-${{ github.ref }}-
            benchmark-baseline-${{ runner.os }}-refs/heads/main-
            benchmark-baseline-${{ runner.os }}-

      - name: Check benchmark regression
        # GitHub-hosted macOS runners are noisy, so this step reports regressions
        # without blocking the workflow while the baseline stabilizes.
        continue-on-error: true
        run: python3 scripts/parse_benchmarks.py --threshold 2.0 --baseline benchmark-baseline.json --output benchmark-baseline.json ./*.log

      - name: Save benchmark baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: benchmark-baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.ref }}-${{ github.run_id }}

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            *-benchmark.log
            benchmark-baseline.json
          retention-days: 7
